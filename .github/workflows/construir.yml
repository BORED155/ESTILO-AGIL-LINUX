# Construye el instalador .deb en los servidores de GitHub.
# Se ejecuta a mano (Actions -> "Construir instalador" -> Run workflow) o al publicar una etiqueta vX.Y.Z;
# con una etiqueta, el .deb queda en la página Releases para descargarlo directamente.
name: Construir instalador

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    # Ubuntu 22.04: el .deb funciona en esa versión y en las más nuevas (Zorin 17, Mint 21+, Debian 12…)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Librerías del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3 libglib2.0-bin libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" pyinstaller
      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Construir el .deb
        run: python empaquetar/construir_deb.py
      - uses: actions/upload-artifact@v4
        with:
          name: estilo-agil-deb
          path: dist/*.deb
      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.deb --title "Estilo Ágil ${{ github.ref_name }}" --notes "Instalador para Zorin, Ubuntu, Linux Mint, Debian y Pop!_OS (64 bits). Descargue el .deb y ábralo con doble clic."
